<!-- Floating Chatbot Widget -->
<style>
    .chatbot-floating-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
    }

    .chatbot-toggle-button {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c89666 0%, #d4a57b 100%);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(200, 150, 102, 0.3);
        transition: all 0.3s ease;
    }

    .chatbot-toggle-button:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(200, 150, 102, 0.5);
    }

    .chatbot-toggle-button.active {
        background: linear-gradient(135deg, #a87550 0%, #c28563 100%);
    }

    .chatbot-floating-modal {
        position: fixed;
        bottom: 100px;
        right: 20px;
        width: 400px;
        height: 600px;
        background: rgba(30, 20, 15, 0.95);
        border: 1px solid rgba(200, 150, 102, 0.3);
        border-radius: 16px;
        display: none;
        flex-direction: column;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
    }

    .chatbot-floating-modal.show {
        display: flex;
    }

    .chatbot-modal-header {
        padding: 16px;
        border-bottom: 1px solid rgba(200, 150, 102, 0.2);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chatbot-modal-title {
        color: #e5dfda;
        font-size: 16px;
        font-weight: 600;
        margin: 0;
    }

    .chatbot-modal-close {
        background: none;
        border: none;
        color: #e5dfda;
        cursor: pointer;
        font-size: 20px;
        opacity: 0.7;
        transition: opacity 0.2s;
    }

    .chatbot-modal-close:hover {
        opacity: 1;
    }

    .chatbot-messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .chatbot-message {
        display: flex;
        animation: fadeIn 0.3s ease-in;
    }

    .chatbot-message.user {
        justify-content: flex-end;
    }

    .chatbot-message.assistant {
        justify-content: flex-start;
    }

    .chatbot-message .bubble {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 12px;
        word-wrap: break-word;
        line-height: 1.5;
        font-size: 13px;
    }

    .chatbot-message.assistant .bubble {
        background: rgba(200, 150, 102, 0.15);
        border: 1px solid rgba(200, 150, 102, 0.3);
        color: #e5dfda;
    }

    .chatbot-message.user .bubble {
        background: rgba(102, 178, 224, 0.2);
        border: 1px solid rgba(102, 178, 224, 0.4);
        color: #b8d5e8;
    }

    .chatbot-placeholder {
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
        padding: 20px;
        font-size: 13px;
    }

    .chatbot-input-area {
        padding: 12px;
        border-top: 1px solid rgba(200, 150, 102, 0.2);
        background: rgba(20, 10, 5, 0.8);
    }

    .chatbot-input-wrapper {
        display: flex;
        gap: 8px;
    }

    .chatbot-textarea {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #e5dfda;
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        resize: none;
        outline: none;
        transition: all 0.3s ease;
    }

    .chatbot-textarea:focus {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(200, 150, 102, 0.5);
    }

    .chatbot-button {
        padding: 8px 12px;
        background: linear-gradient(135deg, #c89666 0%, #d4a57b 100%);
        border: none;
        border-radius: 8px;
        color: #1a1410;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .chatbot-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(200, 150, 102, 0.3);
    }

    .chatbot-button:active {
        transform: translateY(0);
    }

    /* Scrollbar */
    .chatbot-messages-container::-webkit-scrollbar {
        width: 6px;
    }

    .chatbot-messages-container::-webkit-scrollbar-track {
        background: transparent;
    }

    .chatbot-messages-container::-webkit-scrollbar-thumb {
        background: rgba(200, 150, 102, 0.3);
        border-radius: 3px;
    }

    .chatbot-messages-container::-webkit-scrollbar-thumb:hover {
        background: rgba(200, 150, 102, 0.5);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 640px) {
        .chatbot-floating-modal {
            width: calc(100% - 40px);
            bottom: 90px;
            right: 20px;
        }
    }
</style>

<div class="chatbot-floating-widget">
    <button class="chatbot-toggle-button" onclick="toggleChatbot()">
        💬
    </button>
    
    <div class="chatbot-floating-modal" id="chatbotModal">
        <div class="chatbot-modal-header">
            <h3 class="chatbot-modal-title">Asistente Clínico IA</h3>
            <button class="chatbot-modal-close" onclick="toggleChatbot()">✕</button>
        </div>
        
        <div class="chatbot-messages-container" id="chatbotMessagesContainer">
            <div class="chatbot-placeholder">
                Bienvenido al Asistente Clínico. Haz preguntas sobre diagnósticos, resultados de laboratorio y recomendaciones clínicas.
            </div>
        </div>
        
        <div class="chatbot-input-area">
            <div class="chatbot-input-wrapper">
                <textarea 
                    id="chatbotInput"
                    class="chatbot-textarea"
                    placeholder="Escribe tu pregunta..."
                    rows="2"
                ></textarea>
                <button class="chatbot-button" onclick="sendChatbotMessage()">Enviar</button>
            </div>
        </div>
    </div>
</div>

<script>
    let chatbotHistory = [];
    const API_URL = "http://127.0.0.1:8000";

    function toggleChatbot() {
        const modal = document.getElementById('chatbotModal');
        const button = document.querySelector('.chatbot-toggle-button');
        modal.classList.toggle('show');
        button.classList.toggle('active');
        
        if (modal.classList.contains('show')) {
            document.getElementById('chatbotInput').focus();
        }
    }

    function renderChatbotMessages() {
        const container = document.getElementById('chatbotMessagesContainer');
        
        if (chatbotHistory.length === 0) {
            container.innerHTML = `<div class="chatbot-placeholder">Bienvenido al Asistente Clínico. Haz preguntas sobre diagnósticos, resultados de laboratorio y recomendaciones clínicas.</div>`;
            return;
        }

        container.innerHTML = chatbotHistory.map(msg => `
            <div class="chatbot-message ${msg.role}">
                <div class="bubble">${escapeHtml(msg.content)}</div>
            </div>
        `).join('');

        // Auto-scroll to bottom
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function sendChatbotMessage() {
        const input = document.getElementById('chatbotInput');
        const question = input.value.trim();
        
        if (!question) return;

        // Add user message
        chatbotHistory.push({ role: 'user', content: question });
        input.value = '';
        renderChatbotMessages();

        try {
            const token = localStorage.getItem('token');
            const response = await fetch(`${API_URL}/diagnosticos/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    question: question,
                    patient_context: null
                })
            });

            if (!response.ok) {
                throw new Error(`Error ${response.status}`);
            }

            const data = await response.json();
            const assistantResponse = data.assistant_response || data.answer || 'No se pudo procesar la solicitud';
            
            chatbotHistory.push({ role: 'assistant', content: assistantResponse });
            renderChatbotMessages();
        } catch (error) {
            console.error('Error:', error);
            chatbotHistory.push({ 
                role: 'assistant', 
                content: `Error al procesar: ${error.message}. Asegúrate de que el servicio Ollama está corriendo.` 
            });
            renderChatbotMessages();
        }
    }

    // Enter key to send
    document.addEventListener('DOMContentLoaded', function() {
        const input = document.getElementById('chatbotInput');
        if (input) {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatbotMessage();
                }
            });
        }
    });
</script>
