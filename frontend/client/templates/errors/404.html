{% extends 'base.html' %}

{% block title %}Recurso no encontrado - Labotik{% endblock %}

{% block content %}
<div class="animate-fade-in" style="text-align: center; max-width: 500px; margin: 6rem auto;">
    <i data-lucide="alert-circle" style="width: 72px; height: 72px; color: hsl(var(--danger)); margin-bottom: 1.5rem;"></i>
    <h1 style="font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem;">Recurso No Encontrado</h1>
    <p style="color: hsl(var(--text-muted)); font-size: 1.05rem; margin-bottom: 2rem;">
        {{ message|default:"El recurso clínico o la página que buscas no existe o no tienes permisos autorizados para visualizarlo." }}
    </p>
    <a href="{% url 'dashboard' %}" class="btn-premium" style="width: auto; padding: 0.75rem 2rem; text-decoration: none;">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
        <span>Volver al Dashboard</span>
    </a>
</div>
{% endblock %}
