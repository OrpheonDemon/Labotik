<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Laboratorio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.7);
            --border-color: rgba(48, 54, 61, 0.6);
            --primary-color: #58a6ff;
            --success-color: #3fb950;
            --text-color: #c9d1d9;
            --glow-color: rgba(88, 166, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(31, 111, 235, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 139, 253, 0.12) 0px, transparent 50%);
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 40px var(--glow-color);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #a5c6e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .info-row {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #8b949e;
            font-weight: 600;
        }

        .info-value {
            color: #ffffff;
            font-family: monospace;
            word-break: break-all;
        }

        .badge {
            background-color: rgba(63, 185, 80, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(63, 185, 80, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(31, 111, 235, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(31, 111, 235, 0.5);
            filter: brightness(1.15);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #8b949e;
            box-shadow: none;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Conexión Exitosa!</h1>
        <p>Has iniciado sesión correctamente en el Frontend de Django y tu sesión está vinculada al backend de FastAPI.</p>
        
        <div class="user-info">
            <div class="info-row">
                <span class="info-label">Usuario (Email):</span>
                <span class="info-value">{{ email }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Estado de Conexión:</span>
                <span class="badge">Conectado a FastAPI</span>
            </div>
            <div class="info-row" style="flex-direction: column; gap: 8px;">
                <span class="info-label">Token de Acceso JWT (Guardado en Sesión):</span>
                <span class="info-value" style="font-size: 0.75rem; background: #010409; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); max-height: 80px; overflow-y: auto;">{{ token }}</span>
            </div>
        </div>

        <a href="{% url 'logout' %}" class="btn">Cerrar Sesión</a>
    </div>
</body>
</html>
